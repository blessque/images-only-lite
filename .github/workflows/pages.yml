---
# Builds the gallery and publishes it to GitHub Pages on every push.
#
# Nothing here is committed back: the resized photographs live in the Pages artifact only.
# A repository that stores the originals AND four sizes of each grows twice as fast as it
# needs to, and Pages stops publishing at about a gigabyte.
#
# ONE manual step is needed once per repository, and it cannot be automated away:
# Settings -> Pages -> Source -> "GitHub Actions".
#
# `enablement: true` on configure-pages is supposed to do it for you and does not: creating a
# Pages site is not something the built-in GITHUB_TOKEN is allowed to do, whatever the
# workflow permissions say, and it fails with "Resource not accessible by integration".
# See actions/configure-pages#40. So the first step below checks instead, and says what to
# do in words rather than leaving you with that error.
name: Publish

on:
  push:
    branches: [main]
  # So you can republish without pushing — useful after enabling Pages for the first time.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; do not cancel a running one, or a half-finished deploy wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # FIRST, before anything slow. Without this the build runs in full and only then
      # fails inside configure-pages with an API error that explains nothing.
      - name: Check that Pages is on, and set to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two ways to get this wrong, and the second one LOOKS like it worked. "Deploy from
          # a branch" is the default choice in that dropdown, and it publishes the repository
          # files as they are -- so you get a blank page serving index.html with a
          # `/src/main.tsx` in it, and no clue why. Both states are named here.
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo none)
          case "$build_type" in
            workflow)
              echo "Pages is on and builds from Actions." ;;
            none)
              echo "::error title=Turn on GitHub Pages::Go to Settings -> Pages and set Source to 'GitHub Actions', then re-run this workflow. It is a one-time step and this workflow is not allowed to do it for you."
              exit 1 ;;
            *)
              echo "::error title=Change the Pages source to GitHub Actions::Pages is set to deploy from a branch, so it publishes the repository files instead of the built gallery -- which shows up as a blank page. Go to Settings -> Pages, change Source from 'Deploy from a branch' to 'GitHub Actions', then re-run this workflow."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the page, then the photographs
        run: npm run gallery

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
